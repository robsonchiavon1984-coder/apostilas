<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apostilas de Estudo</title>
<meta name="description" content="Apostilas para concursos da magistratura e da SEFAZ/SC, com navegação, edição e comentários.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="btnMenu" aria-label="Abrir índice" title="Índice">☰</button>
  <a class="brand" href="#/">Apostilas</a>
  <div class="crumbs" id="crumbs"></div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="Buscar títulos e texto…" autocomplete="off" aria-label="Buscar">
  </div>
  <button class="iconbtn" id="btnEdit" title="Modo de edição (E)" aria-pressed="false">✎</button>
  <button class="iconbtn" id="btnComments" title="Comentários (C)">💬<span class="badge" id="cBadge" hidden></span></button>
  <button class="iconbtn" id="btnSettings" title="Preferências e sincronização">⚙</button>
</header>

<aside class="sidebar" id="sidebar" aria-label="Índice">
  <div class="side-head">
    <select id="apoSel" aria-label="Apostila"></select>
  </div>
  <nav id="toc"></nav>
</aside>
<div class="scrim" id="scrim" hidden></div>

<main id="main" tabindex="-1">
  <div id="view"></div>
</main>

<aside class="drawer" id="drawer" aria-label="Comentários" hidden>
  <div class="drawer-head">
    <span>Comentários</span>
    <select id="cScope"><option value="ch">deste capítulo</option><option value="apo">desta apostila</option><option value="all">de todas</option></select>
    <button class="iconbtn" id="btnCloseDrawer" aria-label="Fechar">✕</button>
  </div>
  <div id="cList"></div>
</aside>

<div class="selpop" id="selpop" hidden><button id="btnSelComment">💬 Comentar trecho</button><button id="btnSelMark">🖍 Destacar</button></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
